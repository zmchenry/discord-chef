name: ci

# Tests, typecheck and build on every pull request and on pushes to agent
# branches. Never deploys: production deploys are done by Cloudflare Workers
# Builds (Cloudflare's Git integration) on push to main; see README.
on:
  pull_request:
  push:
    branches: ['claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci
      - run: cd web && npm ci

      # API tests (vitest + miniflare D1) and web unit tests.
      - name: test
        run: npm test

      # `npm run build` only compiles web/src. api/src is bundled by esbuild
      # inside `wrangler deploy` with no type analysis, so a Worker with type
      # errors would otherwise build green. Regenerating Env first makes
      # binding drift in wrangler.jsonc fail here too. --env-file /dev/null
      # stops wrangler reading any .env into the generated types.
      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      # Smoke tests at Pixel 7 size against the build, with /api mocked.
      - name: e2e
        run: |
          cd web
          npx playwright install --with-deps chromium
          npx playwright test --trace off
